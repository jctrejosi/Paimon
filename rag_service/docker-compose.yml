name: paimon-rag

services:
  db:
    image: postgres:16-alpine
    container_name: paimon-rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_db
    volumes:
      - rag-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rag:
    # Claves de API compartidas: `.env` único en la raíz de Paimon.
    env_file:
      - ../.env
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUID: "${PUID:-1001}"
        PGID: "${PGID:-1001}"
        # 1 = LibreOffice + Tesseract (extracción universal + OCR).
        INSTALL_EXTRAS: "${INSTALL_EXTRAS:-1}"
    image: paimon-rag:local
    container_name: paimon-rag
    # Solo en loopback: sin autenticación por defecto; no exponer a la red.
    # 8104 queda reservado para este servicio.
    ports:
      - "127.0.0.1:${RAG_HOST_PORT:-8104}:8000"
    user: "${PUID:-1001}:${PGID:-1001}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOME: /tmp
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://rag:rag@db:5432/rag_db}"
      FASTEMBED_CACHE_DIR: /models
      UPLOAD_DIR: /data/uploads
      # Aislamiento por proyecto: schema de PostgreSQL (`rag_<proyecto>`).
      DEFAULT_PROJECT: "${DEFAULT_PROJECT:-default}"
      SCHEMA_PREFIX: "${SCHEMA_PREFIX:-rag_}"
      # Proveedor de embeddings y modelo. `fastembed` es local-first (CPU).
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-fastembed}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}"
      # DEEPSEEK_API_KEY / EMBEDDING_API_KEY / EMBEDDING_BASE_URL / RAG_ROOT_PATH
      # se toman de ../.env (env_file) si existen; aquí no se declaran para no
      # pisarlos con una interpolación vacía.
      # Prefijo público cuando el edge lo publica en /rag.
    volumes:
      # Modelos de embeddings (volumen de datos, no se hornean).
      - ./api/models:/models
      # Archivos originales para el endpoint de descarga.
      - rag-uploads:/data/uploads
    restart: unless-stopped

volumes:
  rag-data:
  rag-uploads:
